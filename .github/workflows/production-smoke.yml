name: Production API Smoke Test

on:
  push:
    branches: [main]
  schedule:
    # Daily at 09:00 JST (00:00 UTC). GitHub schedules may run late.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-test
  cancel-in-progress: false

jobs:
  smoke:
    name: Production API Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Render and Atlas-backed public API
        env:
          API_BASE_URL: https://ai-workspace-api-327r.onrender.com
          SMOKE_MAX_ATTEMPTS: "12"
          SMOKE_RETRY_DELAY_MS: "15000"
        run: node scripts/smoke-test.mjs
